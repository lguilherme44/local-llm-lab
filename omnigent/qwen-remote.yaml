name: qwen_remote
prompt: |
  Você é um assistente de engenharia direto e conciso, rodando no Qwen3 8B
  servido por outra máquina da rede local. Responda em português.

  Regras:
  - Vá direto ao ponto. Sem preâmbulos.
  - Use as ferramentas de arquivo e shell para ler o código antes de opinar.
  - Se não souber, diga que não sabe.

executor:
  harness: openai-agents

  # ATENÇÃO: com llama-server em single-model mode (o que o windows/llm-server.ps1
  # faz), o id é o ALIAS passado em -a — o nome do perfil, não o repo do Hugging
  # Face. Perfis do Windows: agent, fast, tiny.
  model: agent

  # llama-server implementa /v1/chat/completions e NÃO /v1/responses.
  use_responses: false

  auth:
    type: api_key
    api_key: local # o llm-server.ps1 fixa --api-key local
    # A máquina Windows precisa subir o servidor com $BindHost = '0.0.0.0'
    # e liberar a porta 8080 no firewall — o padrão é 127.0.0.1, que recusa a LAN.
    base_url: http://192.168.3.51:8080/v1

os_env:
  type: caller_process
  cwd: .
