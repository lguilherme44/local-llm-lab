<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local LLM Lab — Rode LLMs Locais na Sua GPU</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neon: {
                            blue: '#00d4ff',
                            purple: '#a855f7',
                            pink: '#ec4899',
                            green: '#10b981',
                            cyan: '#06b6d4'
                        },
                        dark: {
                            900: '#0a0a0f',
                            800: '#0f0f1a',
                            700: '#161625',
                            600: '#1e1e30',
                            500: '#2a2a40'
                        }
                    },
                    fontFamily: {
                        mono: ['"JetBrains Mono"', 'monospace'],
                        sans: ['"Inter"', 'system-ui', 'sans-serif']
                    },
                    animation: {
                        'glow': 'glow 2s ease-in-out infinite alternate',
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'slide-up': 'slideUp 0.6s ease-out forwards',
                        'slide-down': 'slideDown 0.4s ease-out forwards',
                        'fade-in': 'fadeIn 0.8s ease-out forwards',
                        'bar-fill': 'barFill 1.5s ease-out forwards',
                        'typing': 'typing 3.5s steps(40, end), blink 0.75s step-end infinite',
                        'grid-move': 'gridMove 20s linear infinite',
                        'spin-slow': 'spin 8s linear infinite',
                        'bounce-slow': 'bounce 3s infinite',
                    },
                    keyframes: {
                        glow: {
                            '0%': { boxShadow: '0 0 5px #00d4ff, 0 0 10px #00d4ff, 0 0 20px #00d4ff' },
                            '100%': { boxShadow: '0 0 10px #a855f7, 0 0 20px #a855f7, 0 0 40px #a855f7' }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-20px)' }
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(40px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        slideDown: {
                            '0%': { opacity: '0', transform: 'translateY(-20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        },
                        barFill: {
                            '0%': { width: '0%' },
                            '100%': { width: 'var(--bar-width)' }
                        },
                        typing: {
                            'from': { width: '0' },
                            'to': { width: '100%' }
                        },
                        blink: {
                            '50%': { borderColor: 'transparent' }
                        },
                        gridMove: {
                            '0%': { transform: 'translate(0, 0)' },
                            '100%': { transform: 'translate(50px, 50px)' }
                        }
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #0a0a0f; color: #e2e8f0; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0f; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #00d4ff, #a855f7); border-radius: 4px; }
        ::selection { background: rgba(0, 212, 255, 0.3); color: #fff; }

        .gradient-text {
            background: linear-gradient(135deg, #00d4ff 0%, #a855f7 50%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .gradient-text-alt {
            background: linear-gradient(135deg, #10b981 0%, #06b6d4 50%, #00d4ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .glass {
            background: rgba(15, 15, 26, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .glass-card {
            background: rgba(22, 22, 37, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            background: rgba(30, 30, 48, 0.8);
            border-color: rgba(0, 212, 255, 0.3);
            transform: translateY(-8px);
            box-shadow: 0 20px 60px rgba(0, 212, 255, 0.1), 0 0 30px rgba(168, 85, 247, 0.05);
        }

        .neon-border {
            position: relative;
        }
        .neon-border::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(135deg, #00d4ff, #a855f7, #ec4899);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .neon-border:hover::before {
            opacity: 1;
        }

        .hero-grid {
            background-image:
                linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
        }

        .hero-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
            pointer-events: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #a855f7);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .btn-primary::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .btn-primary:hover::before { opacity: 1; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 40px rgba(0, 212, 255, 0.3); }
        .btn-primary span { position: relative; z-index: 1; }

        .btn-secondary {
            border: 1px solid rgba(0, 212, 255, 0.3);
            transition: all 0.3s ease;
        }
        .btn-secondary:hover {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(0, 212, 255, 0.15);
        }

        .code-block {
            background: rgba(10, 10, 15, 0.9);
            border: 1px solid rgba(0, 212, 255, 0.15);
            font-family: 'JetBrains Mono', monospace;
        }

        .benchmark-bar {
            transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }
        .reveal-delay-1 { transition-delay: 0.1s; }
        .reveal-delay-2 { transition-delay: 0.2s; }
        .reveal-delay-3 { transition-delay: 0.3s; }
        .reveal-delay-4 { transition-delay: 0.4s; }
        .reveal-delay-5 { transition-delay: 0.5s; }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #00d4ff;
            border-radius: 50%;
            pointer-events: none;
        }

        .testimonial-card {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .testimonial-card:hover {
            transform: scale(1.03);
        }

        @keyframes cursor-blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        .cursor-blink {
            animation: cursor-blink 1s step-end infinite;
        }

        .stat-number {
            font-variant-numeric: tabular-nums;
        }

        .feature-icon {
            transition: all 0.4s ease;
        }
        .glass-card:hover .feature-icon {
            transform: scale(1.1) rotate(5deg);
            filter: drop-shadow(0 0 12px rgba(0, 212, 255, 0.5));
        }

        .mobile-menu {
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .mobile-menu.open {
            transform: translateX(0);
        }

        .nav-link {
            position: relative;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #00d4ff, #a855f7);
            transition: width 0.3s ease;
        }
        .nav-link:hover::after {
            width: 100%;
        }

        .terminal-line {
            opacity: 0;
            animation: fadeIn 0.3s ease forwards;
        }

        .glow-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 10px #10b981, 0 0 20px #10b981;
            animation: pulse 2s ease-in-out infinite;
        }

        .comparison-table th, .comparison-table td {
            transition: all 0.3s ease;
        }
        .comparison-table tr:hover td {
            background: rgba(0, 212, 255, 0.05);
        }

        .cta-glow {
            background: radial-gradient(ellipse at center, rgba(0, 212, 255, 0.15) 0%, transparent 70%);
        }

        .logo-glow {
            filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.3));
        }

        .tag {
            font-size: 0.7rem;
            letter-spacing: 0.05em;
        }

        .section-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.3), rgba(168, 85, 247, 0.3), transparent);
        }
    </style>
</head>
<body class="antialiased">

    <!-- Header / Navigation -->
    <header id="header" class="fixed top-0 left-0 right-0 z-50 transition-all duration-500">
        <div class="glass border-b border-white/5">
            <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-16 lg:h-20">
                    <!-- Logo -->
                    <a href="#" class="flex items-center gap-3 group">
                        <div class="relative">
                            <svg class="w-8 h-8 logo-glow transition-transform duration-300 group-hover:scale-110" viewBox="0 0 32 32" fill="none">
                                <rect x="2" y="2"
